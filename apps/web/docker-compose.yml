# Painel (nginx + React). Incluído pelo docker-compose.yml da raiz (rode de lá):
# depende do serviço api do compose de apps/api.

name: arp-controlapp

services:
  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      API_HOST: api:3000
    ports:
      - "127.0.0.1:8082:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      api:
        condition: service_healthy
