# cp .env.example .env  →  preencher  →  docker compose up -d --build
# Banco: Postgres no serviço "db" (volume pgdata). Backup diário em /var/backups/arp-controlapp
# (serviço "backup", 7 arquivos, um por dia da semana).
#
# Web:  http://localhost:8082  (nginx :80)  — proxy de /api para a API
# API:  http://localhost:3002  (node  :3000)

name: arp-controlapp

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@db:5432/postgres
      DB_SSL: "off"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Defina JWT_ACCESS_SECRET no .env (32+ caracteres)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8082}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Imagens no volume "uploads"; URL absoluta para o app mobile.
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:?Defina STORAGE_PUBLIC_BASE_URL no .env, a origem pública do painel}
      # Heap abaixo do limite do container: o GC age antes do OOM killer.
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - uploads:/app/storage/uploads
    # Maior que SHUTDOWN_TIMEOUT_MS (20 s): o graceful shutdown termina antes do SIGKILL.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: api:3000
    ports:
      - "127.0.0.1:8082:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    # Só na máquina (dev e psql/pg_dump na VPS); a API usa a rede interna.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # pg_dump todo dia às 03:00 numa pasta da VPS (fora dos volumes do Docker:
  # sobrevive a `down -v`). Restaurar: ver README.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/pg-backup.sh"]
    environment:
      TZ: America/Sao_Paulo
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - ./ops/pg-backup.sh:/pg-backup.sh:ro
      - ${BACKUP_DIR:-/var/backups/arp-controlapp}:/backups
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    depends_on:
      db:
        condition: service_healthy

volumes:
  uploads:
  pgdata:
